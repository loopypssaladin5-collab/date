<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ki dat la ? 💌</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg1:#f7dfe9;--bg2:#e9d6f0;--card:#fbf6ee;--tx:#4a1230;--mut:#8a5a70;--ac:#b8124f;--line:#e8cfd8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--tx);font-family:'Nunito',system-ui,sans-serif;display:flex;justify-content:center;padding:16px;overflow-x:hidden}
main{width:100%;max-width:400px;text-align:center;position:relative;z-index:2}
.badge{display:inline-block;background:var(--ac);color:#fff;font-size:.72rem;letter-spacing:.12em;font-weight:800;padding:8px 16px;border-radius:99px;margin:6px 0 14px}
.card{background:var(--card);border-radius:24px;padding:22px 18px;box-shadow:0 14px 40px rgba(120,30,70,.18);text-align:center}
.eye{font-size:.68rem;letter-spacing:.2em;color:var(--ac);font-weight:800}
h1{font-family:'Playfair Display',Georgia,serif;font-size:2rem;line-height:1.1;margin:.35em 0;color:var(--ac)}
p{color:var(--mut);font-size:.9rem;line-height:1.45;margin:.4em 0}
.ph{width:150px;height:150px;margin:12px auto;border-radius:14px;border:3px solid #3b2a30;overflow:hidden;background:#f2dce5;display:flex;align-items:center;justify-content:center;font-size:3.4rem;transition:opacity .25s,transform .25s}
.ph img{width:100%;height:100%;object-fit:cover}
.ph.sw{opacity:0;transform:scale(.9)}
#mood{font-weight:800;color:var(--ac);min-height:1.3em}
.row{display:grid;grid-template-columns:1fr 1.5fr 1.1fr;gap:6px;margin-top:10px}
select,input,textarea{width:100%;background:#fff;color:var(--tx);border:1.5px solid var(--line);border-radius:12px;padding:11px 8px;font:inherit;font-size:1rem}
textarea{min-height:90px;text-align:left}
label{display:block;text-align:left;font-size:.78rem;color:var(--mut);margin:10px 0 3px;font-weight:700}
button{background:var(--ac);color:#fff;border:0;border-radius:99px;padding:14px;font:inherit;font-weight:800;font-size:1rem;width:100%;margin-top:14px;cursor:pointer}
button.alt{background:none;border:1.5px solid var(--ac);color:var(--ac)}
.hide{display:none!important}
#dots{letter-spacing:5px;margin-top:10px}
#hint{background:#fff;border:1.5px dashed var(--ac);border-radius:14px;padding:10px;margin-top:12px;color:var(--tx);font-style:italic}
.shake{animation:sh .45s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#msg{white-space:pre-wrap;font-size:1.05rem;line-height:1.65;color:var(--tx);animation:fd 1.4s}
@keyframes fd{from{opacity:0;transform:translateY(12px)}}
.p{position:fixed;top:-20px;width:10px;height:14px;background:#e9879f;border-radius:70% 0;opacity:.7;pointer-events:none;z-index:1;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
input.o{font-size:.75rem}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#2a1523;--tx:#fbe9ef;--mut:#d3a5b8;--line:#5a2a48}body{background:linear-gradient(160deg,#2a0f20,#1d1030)}select,input,textarea,#hint{background:#1d0e18}}
</style>
</head>
<body>
<main>
<div class="badge">♥ POU OU</div>

<!-- CRÉATEUR -->
<section id="make" class="card">
<div class="eye">MODE CRÉATEUR</div>
<h1>Prépare le secret</h1>
<label>Prénom</label><input id="mN" placeholder="Mon amour">
<label>La vraie date (début des conversations ou 1ère rencontre)</label><input id="mD" type="date">
<label>Indice 1 (après 3 essais)</label><input id="mH1" placeholder="Ex: C'était un samedi, il pleuvait…">
<label>Indice 2 (après 6 essais)</label><input id="mH2" placeholder="Ex: C'était en été…">
<label>Message caché</label><textarea id="mM" placeholder="Ton message d'amour…"></textarea>
<button id="seal">🔒 Sceller et créer le lien</button>
<div id="done" class="hide">
<p>✅ Prêt ! Envoie ce lien :</p>
<input id="lk" class="o" readonly>
<button id="cp">Copier le lien</button>
<button id="wa" class="alt">Envoyer sur WhatsApp</button>
</div>
</section>

<!-- JEU -->
<section id="play" class="card hide">
<div class="eye">YON TI KESYON</div>
<h1>Ki dat la ?</h1>
<p id="q">Èske w sonje ki jou nou te kòmanse pale, oswa premye fwa nou te rankontre ?</p>
<div class="ph" id="ph"></div>
<div id="mood">Ou sonje ? 💭</div>
<div class="row"><select id="d"></select><select id="m"></select><select id="y"></select></div>
<div id="dots"></div>
<div id="hint" class="hide"></div>
<button id="go">Louvri ♥</button>
<p id="err" style="color:var(--ac);font-weight:700"></p>
</section>

<!-- VICTOIRE -->
<section id="win" class="card hide">
<div class="eye">OU SONJE ! 🌹</div>
<h1 id="wt">Se vre !</h1>
<div class="ph" id="ph2" style="width:200px;height:200px"></div>
<div id="msg"></div>
</section>
</main>

 const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await K(norm(d,m,y),s),E.encode(msg)));
 const data=b64(E.encode(JSON.stringify({n:$('mN').value.trim(),h:[$('mH1').value.trim(),$('mH2').value.trim()],s:b64(s),i:b64(iv),c:b64(ct)})));
 const url=location.href.split('#')[0]+'#'+data;
 $('lk').value=url;$('done').classList.remove('hide');
 $('wa').onclick=()=>open('https://wa.me/?text='+encodeURIComponent('Mwen gen yon sekrè pou ou 💌 '+url));
 $('cp').onclick=async()=>{try{await navigator.clipboard.writeText(url);$('cp').textContent='Kopye ✅'}catch(e){$('lk').select()}};
};

/* Jeu */
function setup(p){
 $('make').classList.add('hide');$('play').classList.remove('hide');
 if(p.n)$('q').textContent=p.n+', èske w sonje ki jou nou te kòmanse pale, oswa premye fwa nou te rankontre ?';
 $('d').innerHTML='<option value="">Jou</option>'+Array.from({length:31},(_,i)=>`<option>${i+1}</option>`).join('');
 $('m').innerHTML='<option value="">Mwa</option>'+['janvye','fevriye','mas','avril','me','jen','jiyè','out','septanm','oktòb','novanm','desanm'].map((n,i)=>`<option value="${i+1}">${n}</option>`).join('');
 $('y').innerHTML='<option value="">Ane</option>'+Array.from({length:30},(_,i)=>`<option>${2026-i}</option>`).join('');
 photo($('ph'),0);
 let f=0;
 $('go').onclick=async()=>{
  const d=$('d').value,m=$('m').value,y=$('y').value;
  if(!d||!m||!y){$('err').textContent='Chwazi jou a, mwa a ak ane a.';return}
  try{
   const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(p.i)},await K(norm(d,m,y),ub(p.s)),ub(p.c));
   $('play').classList.add('hide');$('win').classList.remove('hide');
   $('wt').textContent=(p.n?p.n+', ':'')+'se vre ! 💖';photo($('ph2'),3);$('msg').textContent=D.decode(pt);
   for(let i=0;i<60;i++)setTimeout(petals,i*40);
  }catch(e){
   f++;
   const pi=1+((f-1)%2),mi=Math.min(f,3);
   $('ph').classList.add('sw');
   setTimeout(()=>{wrong($('ph'),f-1);$('ph').classList.remove('sw')},250);
   $('mood').textContent=MOODS[1+((f-1)%(MOODS.length-1))];
   $('err').textContent='Se pa bon dat la… eseye ankò 💭';
   $('dots').textContent='🖤'.repeat(Math.min(f,3))+'🤍'.repeat(Math.max(0,3-f))+(f>3?' ×'+f:'');
   const h=f>=6?p.h[1]||p.h[0]:f>=3?p.h[0]:'';
   if(h){$('hint').textContent='💡 Yon ti endis : '+h;$('hint').classList.remove('hide')}
   const c=$('play');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');
  }
 };
}
try{if(location.hash.length>10)setup(JSON.parse(D.decode(ub(location.hash.slice(1)))))}catch(e){}
